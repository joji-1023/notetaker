spring.application.name=notetaker
server.port=${PORT:8080}

# PostgreSQL Database Connection (Neon DB via Render Environment Variables)
spring.datasource.url=${JDBC_DATABASE_URL}
spring.datasource.username=${JDBC_DATABASE_USERNAME}
spring.datasource.password=${JDBC_DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate settings for PostgreSQL
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# SendGrid configuration (set SENDGRID_API_KEY and SENDGRID_FROM_EMAIL as env vars on Render)
# SENDGRID_FROM_EMAIL must be the exact address you verified via Single Sender Verification
sendgrid.api.key=${SENDGRID_API_KEY}
sendgrid.from.email=${SENDGRID_FROM_EMAIL}

# Surface real error messages in API responses (helps debugging on Render)
server.error.include-message=always
